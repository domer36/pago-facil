services:
  backend:
    build:
      context: ./backend/quote-generator
    environment:
      PORT: 3000
    expose:
      - "3000"

  pdf-generator:
    build:
      context: ./backend/pdf-generator
    environment:
      PORT: 3000
    expose:
      - "3000"

  frontend:
    build:
      context: ./frontend/webapp
    depends_on:
      - backend
      - pdf-generator
    ports:
      - "4200:80"
